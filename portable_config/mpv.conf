# FSRCNNX Player — only FSRCNNX-8 and FSRCNNX-16. No other shaders.

vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=auto-copy
hwdec-codecs=all
profile=high-quality

scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
dither-depth=auto
temporal-dither=yes
deband=no

keep-open=yes
autofit-larger=90%x90%
osc=yes
osd-font=Segoe UI
osd-font-size=32
osd-duration=2200
cursor-autohide=1000
gpu-shader-cache-dir=~~/shader-cache

# Default: FSRCNNX-8 (lighter; switch with 1 / 2 or --profile)
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

[fsrcnnx8]
profile-desc=FSRCNNX-8 (fast)
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

[fsrcnnx16]
profile-desc=FSRCNNX-16 (quality)
glsl-shaders="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"
