# FSRCNNX only — 1 = FSRCNNX-8, 2 = FSRCNNX-16
1 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"; show-text "FSRCNNX-8"
2 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"; show-text "FSRCNNX-16"

SPACE cycle pause
f cycle fullscreen
q quit
ESC quit
m cycle mute
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60
. frame-step
, frame-back-step
i script-binding stats/display-stats-toggle
s screenshot
